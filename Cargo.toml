[package]
name = "dioxus_google_font_embedder"
version = "0.1.0"
authors = ["Machine on a Mission <machineonamission@gmail.com>"]
edition = "2024"
[lib]
proc-macro = true
[dependencies]
anyhow = "1.0.104"
syn = { version = "3.0.3", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
ureq = "3.3.0"  # blocking HTTP client — important, see note below
urlencoding = "2.1.3"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
url = "2.5.8"
regex = "1.13.1"
md5 = "0.8.1"
