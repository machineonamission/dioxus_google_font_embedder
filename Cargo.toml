[package]
name = "dioxus_google_font_embedder"
version = "1.0.0"
authors = ["Machine on a Mission <machineonamission@gmail.com>"]
edition = "2024"
license = "LGPL-3.0-or-later"
description = "Rust macro that automatically downloads, caches, and embeds Google Fonts into a Dioxus app at compile-time for offline usage"
homepage = "https://github.com/machineonamission/dioxus_google_font_embedder"
repository = "https://github.com/machineonamission/dioxus_google_font_embedder"
readme = "README.md"
keywords = ["dioxus", "google-fonts", "macro", "compile-time", "embedding"]
categories = ["gui", "web-programming"]
exclude = ["img.png"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0.3", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
ureq = "3.3.0"  # blocking HTTP client — important, see note below
regex = "1.13.1"
md5 = "0.8.1"
